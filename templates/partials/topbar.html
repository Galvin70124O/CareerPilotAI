{% from "partials/macros.html" import icon, logo_mark %}
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{{ url_for('home') }}" aria-label="CareerPilot AI home">
      {{ logo_mark(32) }}
      <span class="brand-name">CareerPilot <span>AI</span></span>
    </a>
    <nav class="topbar-actions" aria-label="Site">
      {# data-tooltip shows "View source on GitHub" on hover AND keyboard focus (title alone only works on hover) #}
      <a class="btn btn-ghost btn-icon has-tooltip" href="https://github.com/Galvin70124O/CareerPilotAI" target="_blank" rel="noopener"
         aria-label="View source on GitHub (opens in a new tab)" data-tooltip="View source on GitHub">{{ icon("github", 18) }}</a>
      <button type="button" class="btn btn-ghost btn-icon theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        {{ icon("moon", 18, class="icon-moon") }}{{ icon("sun", 18, class="icon-sun") }}
      </button>
    </nav>
  </div>
</header>
